name: Aggiorna indice CNEL

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scarica e compatta gli Open Data CNEL
        run: node scripts/update-cnel.mjs
      - name: Pubblica l'aggiornamento se i dati sono cambiati
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cnel-index.js
          git commit -m "chore: aggiorna indice CNEL"
          git push
